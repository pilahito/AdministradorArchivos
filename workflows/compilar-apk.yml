name: Compilar APK

# Se ejecuta automáticamente en cada "push" a main y también se puede
# lanzar manualmente desde la pestaña Actions del repositorio (botón
# "Run workflow").
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # NOTA: este proyecto no incluye el "gradle wrapper" (gradlew /
      # gradle-wrapper.jar) porque ese .jar es un binario y yo solo puedo
      # generar archivos de texto. Por eso usamos la acción oficial de
      # Gradle, que instala Gradle directamente en el runner sin necesitar
      # el wrapper. Si más adelante prefieres el wrapper clásico, corre
      # "gradle wrapper" una vez en tu máquina y súbelo al repo — a partir
      # de ahí podrías volver a usar "./gradlew assembleDebug".
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de depuración
        run: gradle assembleDebug --no-daemon

      - name: Publicar el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: administrador-archivos-apk
          path: app/build/outputs/apk/debug/app-debug.apk
