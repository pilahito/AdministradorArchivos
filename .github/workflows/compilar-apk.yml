name: Compilar APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CloudTermPro-debug.apk
          cp dist/CloudTermPro-debug.apk dist/CyberTerm-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cloudtermpro-apk
          path: |
            dist/CloudTermPro-debug.apk
            dist/CyberTerm-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.4.{0}-pro', github.run_number) }}
          name: CloudTerm Pro ${{ github.ref_type == 'tag' && github.ref_name || format('v0.4.{0}-pro', github.run_number) }}
          body: |
            APK de **CloudTerm Pro** (SSH / SFTP / tuneles / sync).

            1. Descarga **CloudTermPro-debug.apk**
            2. Permite origenes desconocidos
            3. Instala

            Commit `${{ github.sha }}`.
          files: |
            dist/CloudTermPro-debug.apk
            dist/CyberTerm-debug.apk
          generate_release_notes: true
          make_latest: true
