name: Compilar APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon --stacktrace
      - run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Sesiones-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sesiones-apk
          path: dist/Sesiones-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.3.{0}', github.run_number) }}
          name: Sesiones ${{ github.ref_type == 'tag' && github.ref_name || format('v0.3.{0}', github.run_number) }}
          body: |
            APK de **Sesiones** (SSH / SFTP / túneles).

            1. Descarga **Sesiones-debug.apk**
            2. Permite orígenes desconocidos
            3. Instala

            Commit `${{ github.sha }}`.
          files: dist/Sesiones-debug.apk
          generate_release_notes: true
          make_latest: true
