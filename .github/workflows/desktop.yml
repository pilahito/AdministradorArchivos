name: Desktop (Windows + Linux)

on:
  workflow_dispatch:
  push:
    branches: [main, desktop-win-linux]
    paths:
      - "app-desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "app-desktop/**"
      - ".github/workflows/desktop.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis,msi"
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: bash app-desktop/scripts/install-linux-deps.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app-desktop/package-lock.json


      - name: Install frontend dependencies
        working-directory: app-desktop
        run: npm ci


      - name: Build CloudTerm Pro
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app-desktop
          tauriScript: npm run tauri
          args: ${{ matrix.args }}


      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudterm-pro-${{ matrix.platform }}
          path: |
            app-desktop/src-tauri/target/release/bundle/**/*
            app-desktop/src-tauri/target/release/cloudterm-pro*
          if-no-files-found: warn


