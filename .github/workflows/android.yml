name: Android CI

on:
  push:
    branches: [ "main", "cloudterm-pro" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  jvm-modules:
    name: Compile JVM modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compile Kotlin modules
        run: |
          gradle :core-ssh:compileKotlin \
                 :vault:compileKotlin \
                 :sync-providers:compileKotlin \
                 :cloud-sync:compileKotlin \
                 :terminal:compileKotlin \
                 :ui-shared:compileKotlin \
                 --no-daemon --stacktrace

  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    needs: jvm-modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - uses: android-actions/setup-android@v3
      - name: Assemble
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Rename artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CloudTermPro-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cloudtermpro-apk
          path: dist/CloudTermPro-debug.apk
          if-no-files-found: error
          retention-days: 14