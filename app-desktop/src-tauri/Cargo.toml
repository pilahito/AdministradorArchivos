[package]
name = "cloudterm-pro"
version = "1.1.0"
description = "CloudTerm Pro desktop SSH/SFTP client"
authors = ["CloudTerm Pro"]
edition = "2021"

[lib]
name = "cloudterm_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cloudterm-pro"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
portable-pty = "0.8.1"
which = "6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
